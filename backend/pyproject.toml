[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocabra"
version = "0.6.0"
description = "Multi-GPU AI model server with OpenAI and Ollama API compatibility"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis[asyncio]>=5.2",
    "httpx>=0.28",
    "websockets>=13.0",
    "pynvml>=11.5",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "huggingface-hub>=0.27",
    "python-multipart>=0.0.30",
    "prometheus-client>=0.21",
    "docker>=7.0",
    "bcrypt>=4.0",
    "PyJWT>=2.13.0",
    "langfuse>=2.0",
    "mcp>=0.9.0",
    "jsonschema>=4.21.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]
vllm = [
    "vllm==0.26.0",
    "nvidia-cuda-nvcc==13.0.88",
    "nvidia-nvvm==13.0.88",
    "nvidia-cuda-crt==13.0.88",
    "sentencepiece>=0.2",
]
diffusers = [
    "diffusers>=0.31",
    "accelerate>=1.2",
    "Pillow>=11.0",
]
audio = [
    "faster-whisper>=1.1",
    "soundfile>=0.12",
    "transformers>=4.47",
    "pyannote.audio>=3.3",
    "nemo_toolkit[asr]>=2.2",
    "matplotlib>=3.10",
    "kokoro>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ocabra*"]

[tool.ruff]
line-length = 100
# Las migraciones de Alembic son artefactos generados e inmutables (ver
# CLAUDE.md: no se reescriben ni se borran). Reordenar sus imports no aporta
# nada y ensucia el historial de cada revision.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "E501",
    # UP042 propone cambiar `class X(str, Enum)` por `StrEnum`. Es un cambio de
    # comportamiento, no cosmetico: con (str, Enum) `str(X.A)` da "X.A" y con
    # StrEnum da "a". Estos enums se persisten (UserRole en BD), cruzan la API
    # y se emiten en los logs de structlog, asi que migrarlos exige revisar cada
    # ruta de serializacion a cambio de ninguna mejora funcional. Aplazado a
    # proposito, no es un falso positivo.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI inyecta dependencias llamando a estos helpers en el default del
# argumento: es el idiom oficial, no un default mutable. Se exentan por nombre
# en lugar de silenciar B008 entero para seguir cazando defaults mutables de
# verdad (list(), dict(), datetime.now()...).
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
    "ocabra.api._deps_auth.require_role",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ocabra"]
omit = ["tests/*"]
