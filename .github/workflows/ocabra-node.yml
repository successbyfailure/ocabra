# Build and publish the ocabra-node image (backend/Dockerfile.node) to GHCR.
#
# Manual only for now: a CUDA build for 7 architectures takes a while and
# Actions minutes are limited. Switch `on:` to tags (e.g. `push: tags: ["v*"]`)
# when it should follow releases automatically.
name: ocabra-node image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag besides 'latest' (e.g. 0.83.1)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (CUDA devel image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ocabra-node"
          tags="${image}:latest"
          if [ -n "${{ inputs.tag }}" ]; then tags="${tags},${image}:${{ inputs.tag }}"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.node
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
