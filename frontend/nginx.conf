# 2026-10-31: some of our own SPA routes (/models, /batches, ...) are also
# real OpenAI-style top-level resource names under /v1/*, so a path-based
# deny-list for "looks like a missing-prefix API call" would 404 real pages.
# Content-negotiate the SPA fallback instead: a browser navigating to a page
# always sends Accept: text/html (default for top-level navigation); a
# script/curl hitting a wrong path (e.g. /model/info instead of
# /v1/model/info) almost never does. This only runs for the FALLBACK branch
# of try_files below — real static files (JS/CSS/images, matched by $uri
# first) are served unconditionally regardless of Accept, so this can't
# repeat the mistake of 404ing the app's own assets.
map $http_accept $spa_fallback_wants_html {
    default 0;
    "~*text/html" 1;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for real page navigation; anything
    # that isn't a real file AND doesn't look like a browser asking for a
    # page gets a clean 404 instead of silently absorbing the request.
    location / {
        try_files $uri $uri/ @spa_fallback;
    }

    location @spa_fallback {
        if ($spa_fallback_wants_html = 0) {
            return 404;
        }
        rewrite ^ /index.html last;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
