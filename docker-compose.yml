services:
  api:
    # Default: slim image (no AI backends pre-installed). Backends are
    # installed on demand into /data/backends via BackendInstaller.
    # For a rollback to the legacy fat image with everything pre-installed,
    # use:  docker compose -f docker-compose.yml -f docker-compose.fat.yml ...
    build:
      context: ./backend
      dockerfile: Dockerfile.slim
    # Self-update (backend/ocabra/core/self_update.py): a node that pulls the
    # releases sets OCABRA_API_IMAGE / OCABRA_FRONTEND_IMAGE in .env to
    # ghcr.io/successbyfailure/ocabra-{api,frontend}:X.Y.Z and the updater
    # moves them. Unset, the stack builds and runs its own images as before.
    image: ${OCABRA_API_IMAGE:-ocabra-api:slim}
    gpus: all
    ipc: host
    shm_size: "8gb"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MODELS_DIR: /data/models
      HF_CACHE_DIR: /data/hf_cache
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      VLLM_ENFORCE_EAGER: ${VLLM_ENFORCE_EAGER:-true}
      VLLM_ATTENTION_BACKEND: ${VLLM_ATTENTION_BACKEND:-}
      VLLM_ENABLE_PREFIX_CACHING: ${VLLM_ENABLE_PREFIX_CACHING:-true}
      VLLM_MAX_NUM_SEQS: ${VLLM_MAX_NUM_SEQS:-16}
      VLLM_MAX_NUM_BATCHED_TOKENS: ${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      VLLM_TENSOR_PARALLEL_SIZE: ${VLLM_TENSOR_PARALLEL_SIZE:-}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-}
      VLLM_ENABLE_CHUNKED_PREFILL: ${VLLM_ENABLE_CHUNKED_PREFILL:-}
      VLLM_KV_CACHE_DTYPE: ${VLLM_KV_CACHE_DTYPE:-}
      VLLM_TRUST_REMOTE_CODE: ${VLLM_TRUST_REMOTE_CODE:-false}
      VLLM_DISABLE_LOG_REQUESTS: ${VLLM_DISABLE_LOG_REQUESTS:-true}
      BITNET_SERVER_BIN: ${BITNET_SERVER_BIN:-/usr/local/bin/bitnet-server}
      BITNET_PRISMML_SERVER_BIN: ${BITNET_PRISMML_SERVER_BIN:-/usr/local/bin/bonsai-server}
      BITNET_GPU_LAYERS: ${BITNET_GPU_LAYERS:-0}
      BITNET_CTX_SIZE: ${BITNET_CTX_SIZE:-4096}
      BITNET_THREADS: ${BITNET_THREADS:-}
      BITNET_BATCH_SIZE: ${BITNET_BATCH_SIZE:-512}
      BITNET_UBATCH_SIZE: ${BITNET_UBATCH_SIZE:-128}
      BITNET_PARALLEL: ${BITNET_PARALLEL:-1}
      BITNET_FLASH_ATTN: ${BITNET_FLASH_ATTN:-false}
      BITNET_MLOCK: ${BITNET_MLOCK:-true}
      BITNET_CACHE_TYPE_K: ${BITNET_CACHE_TYPE_K:-}
      BITNET_CACHE_TYPE_V: ${BITNET_CACHE_TYPE_V:-}
      BITNET_STARTUP_TIMEOUT_S: ${BITNET_STARTUP_TIMEOUT_S:-30}
      VIBEASR_PYTHON_BIN: ${VIBEASR_PYTHON_BIN:-/opt/vibeasr-venv/bin/python}
      VIBEASR_STREAM_SERVER_BIN: ${VIBEASR_STREAM_SERVER_BIN:-/usr/local/bin/asr_stream_server}
      VIBEASR_THREADS: ${VIBEASR_THREADS:-8}
      VIBEASR_STARTUP_TIMEOUT_S: ${VIBEASR_STARTUP_TIMEOUT_S:-300}
      COMFYUI_UI_URL: ${COMFYUI_UI_URL:-}
      A1111_UI_URL: ${A1111_UI_URL:-}
      # Gradio mode (default): http://acestep:7860 | API mode: http://acestep:8001
      ACESTEP_BASE_URL: ${ACESTEP_BASE_URL:-http://acestep:7860}
      ACESTEP_UI_URL: ${ACESTEP_UI_URL:-}
      ACESTEP_PREFERRED_GPU: ${ACESTEP_PREFERRED_GPU:-1}
      UNSLOTH_UI_URL: ${UNSLOTH_UI_URL:-}
      UNSLOTH_PREFERRED_GPU: ${UNSLOTH_PREFERRED_GPU:-1}
      OCABRA_ADMIN_USER: ${OCABRA_ADMIN_USER:-ocabra}
      OCABRA_ADMIN_PASS: ${OCABRA_ADMIN_PASS:-ocabra}
      JWT_SECRET: ${JWT_SECRET:-}
      # Docker operations go through the docker-agent service (SEG-03).
      DOCKER_AGENT_URL: ${DOCKER_AGENT_URL:-http://docker-agent:8790}
      REQUIRE_API_KEY_OPENAI: ${REQUIRE_API_KEY_OPENAI:-true}
      REQUIRE_API_KEY_OLLAMA: ${REQUIRE_API_KEY_OLLAMA:-true}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
      LANGFUSE_SAMPLE_RATE: ${LANGFUSE_SAMPLE_RATE:-1.0}
    env_file: .env
#    ports:
#      - "8000:8000"
    volumes:
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models:/data/models
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/hf_cache:/data/hf_cache
      - ./data/openai_files:/data/openai_files
      - ./data/image_outputs:/data/image_outputs
      - backends_data:/data/backends
      # Token the docker agent writes at startup (read-only here).
      - docker_agent_token:/run/ocabra-agent:ro
      # Read-only mount of Ollama's manifest/blob store so the local scanner
      # can surface Ollama-pulled GGUFs as llama.cpp candidates without a
      # second download. Disabled by default (no OLLAMA_SHARED_MODELS_DIR);
      # set to /data/ollama_models in .env to enable.
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ollama/models:/data/ollama_models:ro
      # No Docker socket, no .env, no compose file here (SEG-03 phase 2,
      # 2026-11-17): every Docker operation goes to docker-agent, which holds
      # them. With the socket, whoever controlled the api was root on the host.
      # Global settings of the shared Ollama daemon (parallelism, max
      # context): oCabra writes this file from Ajustes and docker-agent
      # recreates the ollama service, which reads it through env_file (below).
      - ./data/ollama:/opt/ocabra/data/ollama
      # The ACE-Step backend's legacy layout reads the repo here
      # (settings.acestep_project_dir).
      - ${ACESTEP_ROOT:-/docker/ACE-Step-1.5}:${ACESTEP_ROOT:-/docker/ACE-Step-1.5}:ro
      # ACE-Step weights checkpoint dir (~11 GB) is mounted into the modular
      # install path so the cloned src/ tree finds them where the acestep
      # server expects (<project_root>/checkpoints/). Avoids re-downloading
      # at first generation. NOT read-only — ACE-Step writes minor config
      # syncs (configuration_*.py) into the checkpoint subdirs on first
      # init. Bloque 15 — 2026-04-25.
      - ${ACESTEP_ROOT:-/docker/ACE-Step-1.5}/checkpoints:/data/backends/acestep/src/checkpoints
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # The only service meant to hold the Docker socket (SEG-03,
  # docs/REVISION-2026-11-16.md). Same image as the api, its own process: it
  # runs only oCabra's own Docker operations (optional services, the Ollama
  # daemon, self-update, TensorRT-LLM compilation), each built here from
  # validated arguments (backend/ocabra/docker_agent/ops.py). Same idea as
  # hw-monitor, which alone may change GPU power limits. No published port:
  # the api reaches it on the compose network, with a token the agent writes
  # at startup to a volume only the two of them share.
  docker-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.slim
    image: ${OCABRA_API_IMAGE:-ocabra-api:slim}
    entrypoint: ["python", "-m", "ocabra.docker_agent"]
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - docker_agent_token:/run/ocabra-agent
      # What `docker compose` needs to resolve oCabra's own project: the
      # compose file, its .env, the Ollama env_file and the build contexts
      # of the optional services, at the same paths the api uses.
      - ./docker-compose.yml:/opt/ocabra/docker-compose.yml:ro
      - ./.env:/opt/ocabra/.env:ro
      - ./data/ollama:/opt/ocabra/data/ollama:ro
      - ./services:/opt/ocabra/services:ro
      - ./TRELLIS.2:/opt/ocabra/TRELLIS.2:ro
      - ${ACESTEP_ROOT:-/docker/ACE-Step-1.5}:${ACESTEP_ROOT:-/docker/ACE-Step-1.5}:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8790/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ${OCABRA_FRONTEND_IMAGE:-ocabra-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    user: "${FRONTEND_UID:-1000}:${FRONTEND_GID:-1000}"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ocabra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocabra}
      POSTGRES_DB: ${POSTGRES_DB:-ocabra}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocabra}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  hw-monitor:
    build:
      context: ./hw-monitor
      dockerfile: Dockerfile
    privileged: true
    gpus: all
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ocabra:ocabra@postgres:5432/ocabra}
      NVIDIA_VISIBLE_DEVICES: all
      THERMAL_CAP_ENABLED: ${THERMAL_CAP_ENABLED:-true}
    volumes:
      - /sys/class/powercap:/sys/class/powercap:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Pool único desde la migración a llama.cpp custom (2026-11-02). Antes
  # había 4 pools (3090 dedicada, 3060 dedicada, shared np1/np2) para
  # compensar que OLLAMA_NUM_PARALLEL es env del daemon, no ajustable por
  # request, y que un modelo grande necesitaba repartirse entre ambas GPUs.
  # llama_cpp ya soporta --parallel y tensor-split por modelo sin ese
  # problema, así que los modelos grandes/multi-GPU se migraron ahí. Ollama
  # queda para lo aún no migrado y como fallback "-ollama" — un pool basta.
  # NVIDIA_VISIBLE_DEVICES: all también evita el fallo de CDI en hosts con
  # una sola GPU (visto en phobos: pedir el índice "1" explícito rompía
  # ahí porque solo existe el índice 0).
  ollama:
    # Imagen oficial tal cual. Hasta 2026-11-17 se le añadía ffmpeg
    # (Dockerfile.ollama): en 0.32 el path multimodal lo necesitaba hasta para
    # JPEG/PNG. Con 0.40.16 la imagen oficial, sin ffmpeg, decodifica PNG,
    # JPEG, WAV y MP3 (probado con gemma4:12b), y una imagen local impedía
    # `docker compose pull` en los nodos. El actualizador del panel hace
    # `pull` + recrear (y `build --pull` si algún nodo vuelve a usar build:).
    image: ollama/ollama:latest
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Sin esto CUDA ordena GPUs por "fastest first": CUDA0=3090, CUDA1=3060.
      # oCabra usa NVML (PCI order): GPU 0=3060, GPU 1=3090. Con PCI_BUS_ID
      # Ollama y oCabra hablan de la misma GPU al decir "0" o "1".
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      OLLAMA_HOST: 0.0.0.0:11434
      # KV cache en q8_0 (mitad de VRAM de KV, ~sin pérdida de calidad). La
      # cuantización del KV en llama.cpp REQUIERE flash attention activado.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    # Paralelismo y contexto máximo (OLLAMA_NUM_PARALLEL y
    # OLLAMA_CONTEXT_LENGTH): ajustes globales de oCabra (Ajustes > Ollama),
    # que escribe este fichero y recrea el servicio. Un único daemon para
    # todos los modelos de Ollama: los pools por GPU se retiraron 2026-11-12.
    env_file:
      - path: ./data/ollama/ollama.env
        required: false
    volumes:
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ollama:/root/.ollama
    # Solo desde el propio host. oCabra habla con Ollama por la red de compose
    # (http://ollama:11434) y lo protege con claves, grupos y estadísticas;
    # publicado en todas las interfaces, cualquiera de la red usaba, descargaba
    # o borraba modelos sin autenticarse. OLLAMA_BIND=0.0.0.0 lo reabre a
    # propósito.
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:7869:11434"
    restart: unless-stopped

  trellis2:
    profiles: ["services"]
    build:
      context: ./TRELLIS.2
      dockerfile: docker/Dockerfile
    # Evaluación paralela a Hunyuan3D (ver docs de integración): mismo patrón
    # de servicio interactivo (carga/descarga perezosa, /health, /runtime/status,
    # /runtime/unload). Validado en la 3090: ~9GB VRAM pico, sin OOM.
    command: ["python", "server_app.py", "--host", "0.0.0.0", "--port", "8080",
              "--cache-path", "./gradio_cache",
              "--root-path", "${TRELLIS2_ROOT_PATH:-}",
              "--public-url", "${TRELLIS2_UI_URL:-}"]
    gpus: all
    environment:
      # NOT "all": CUDA orders GPUs by "fastest first" inside the container
      # (cuda:0=3090, cuda:1=3060) while oCabra's own NVML-based indexing
      # (what ensure_vram/preferred_gpu talk about) uses PCI order (GPU
      # 0=3060, GPU 1=3090) — same mismatch already documented on the ollama
      # service above. pipeline.cuda() in server_app.py always grabs
      # cuda:0 with no explicit device index, so exposing both GPUs meant it
      # silently used whichever the driver put first — usually the 3090 by
      # luck, but not always, and oCabra's VRAM reservation was tracking
      # *its own* "GPU 1" regardless of which one that actually was inside
      # the container. Reproduced 2026-09-29: ensure_vram reserved oCabra's
      # GPU 0 (the 3060) while the container's cuda:0 (still the 3090) ran
      # completely unprotected, causing a real OOM. Restricting visibility to
      # a single GPU (same pattern as acestep/unsloth-studio below) removes
      # the ambiguity entirely — only ever the 3090, always cuda:0.
      NVIDIA_VISIBLE_DEVICES: ${TRELLIS2_NVIDIA_VISIBLE_DEVICES:-1}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      IDLE_TIMEOUT_SECONDS: ${TRELLIS2_IDLE_UNLOAD_SECONDS:-300}
      IDLE_CHECK_INTERVAL_SECONDS: 30
      MALLOC_TRIM_THRESHOLD_: 0
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      # Para pedirle a oCabra que libere VRAM (evict on-demand/warm) en su GPU
      # preferida antes de cargar el pipeline — ver POST .../ensure_vram en
      # docs/CONTRACTS.md 5.7. Sin esto, compite en silencio por VRAM con lo
      # que ya esté cargado y puede colgarse en vez de fallar limpio.
      OCABRA_API_URL: http://api:8000
      GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:-}
      OCABRA_SERVICE_ID: trellis2
    volumes:
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/hf_cache:/root/.cache/huggingface
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/trellis2:/workspace/TRELLIS.2/gradio_cache
    ports:
      - "${TRELLIS2_PORT:-8481}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  comfyui:
    profiles: ["services"]
    build:
      context: ./services/comfyui
      dockerfile: Dockerfile
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
    volumes:
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/hf_cache:/root/.cache/huggingface
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/checkpoints:/opt/ComfyUI/models/checkpoints
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/vae:/opt/ComfyUI/models/vae
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/loras:/opt/ComfyUI/models/loras
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/embeddings:/opt/ComfyUI/models/embeddings
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/controlnet:/opt/ComfyUI/models/controlnet
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/upscalers:/opt/ComfyUI/models/upscale_models
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/comfyui:/opt/ComfyUI/user
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  a1111:
    profiles: ["services"]
    build:
      context: ./services/a1111
      dockerfile: Dockerfile
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /home/a1111/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /home/a1111/.cache/huggingface/hub
      COMMANDLINE_ARGS: --listen --api --port 7860 --skip-torch-cuda-test --enable-insecure-extension-access
    volumes:
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/hf_cache:/home/a1111/.cache/huggingface
      - a1111_venv:/opt/stable-diffusion-webui/venv
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/checkpoints:/opt/stable-diffusion-webui/models/Stable-diffusion
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/vae:/opt/stable-diffusion-webui/models/VAE
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/loras:/opt/stable-diffusion-webui/models/Lora
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/embeddings:/opt/stable-diffusion-webui/embeddings
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/image/upscalers:/opt/stable-diffusion-webui/models/ESRGAN
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/models/a1111:/opt/stable-diffusion-webui/config_states
      - ./services/a1111/ocabra-free-memory:/opt/stable-diffusion-webui/extensions/ocabra-free-memory
    ports:
      - "${A1111_PORT:-7860}:7860"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/sdapi/v1/memory"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  acestep:
    profiles: ["services"]
    build:
      context: ${ACESTEP_ROOT:-/docker/ACE-Step-1.5}
      dockerfile: Dockerfile
    image: acestep:latest
    container_name: ocabra-acestep-1
    gpus: all
    ipc: host
    shm_size: "2gb"
    environment:
      NVIDIA_VISIBLE_DEVICES: ${ACESTEP_NVIDIA_VISIBLE_DEVICES:-1}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # "gradio" (default) — Gradio UI on port 7860
      # "api"              — REST API on port 8001 (set ACESTEP_BASE_URL=http://acestep:8001 in api service)
      ACESTEP_MODE: ${ACESTEP_MODE:-gradio}
      ACESTEP_LLM_BACKEND: ${ACESTEP_LLM_BACKEND:-pt}
      ACESTEP_INIT_SERVICE: ${ACESTEP_INIT_SERVICE:-true}
      ACESTEP_CONFIG_PATH: ${ACESTEP_CONFIG_PATH:-acestep-v15-turbo}
      ACESTEP_LM_MODEL_PATH: ${ACESTEP_LM_MODEL_PATH:-acestep-5Hz-lm-0.6B}
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: /root/.cache/huggingface
      # Gradio rewrite: sin esto la UI emite URLs absolutas con el host interno
      # (`https://acestep:7860/...`) en vez de la URL pública. Gradio respeta
      # GRADIO_ROOT_PATH y reescribe los enlaces del bundle frontend en cuanto
      # arranca. ACE-Step no expone --root-path como flag, así que vía env.
      GRADIO_ROOT_PATH: ${ACESTEP_UI_URL:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/hf_cache:/root/.cache/huggingface
      - ${ACESTEP_ROOT:-/docker/ACE-Step-1.5}/checkpoints:/app/checkpoints
      - ${ACESTEP_ROOT:-/docker/ACE-Step-1.5}/gradio_outputs:/app/gradio_outputs
      - ${ACESTEP_ROOT:-/docker/ACE-Step-1.5}/lora_output:/app/lora_output
    ports:
      # Gradio mode (default): port 7860
      - "${ACESTEP_GRADIO_PORT:-7862}:7860"
      # API mode: uncomment if running with ACESTEP_MODE=api
      # - "${ACESTEP_API_PORT:-8001}:8001"
    healthcheck:
      test: >-
        curl -sf http://localhost:7860/ > /dev/null 2>&1 ||
        curl -sf http://localhost:8001/health > /dev/null 2>&1 ||
        exit 1
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    restart: unless-stopped

  unsloth-studio:
    profiles: ["services"]
    image: ${UNSLOTH_IMAGE:-unsloth/unsloth:latest}
    container_name: ocabra-unsloth-studio-1
    gpus: all
    ipc: host
    shm_size: "4gb"
    environment:
      NVIDIA_VISIBLE_DEVICES: ${UNSLOTH_NVIDIA_VISIBLE_DEVICES:-1}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      JUPYTER_PASSWORD: ${UNSLOTH_JUPYTER_PASSWORD:-ocabra}
      # HF cache vive dentro de /workspace/work (chowned a `unsloth` por el
      # entrypoint). Usa cache propio en vez del compartido — el HF cache de
      # ocabra es root-owned y Studio corre como user no-root.
      HF_HOME: /workspace/work/hf_cache
      HUGGINGFACE_HUB_CACHE: /workspace/work/hf_cache/hub
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/unsloth/work:/workspace/work
      - ${AI_MODELS_ROOT:-/docker/ai-models}/ocabra/unsloth/exports:/workspace/exports
    ports:
      # Unsloth Studio UI (entrypoint principal: training + chat + export)
      - "${UNSLOTH_STUDIO_PORT:-8889}:8000"
      # Jupyter Lab que viene en la imagen (notebooks, control avanzado).
      # Descomentar si quieres acceso directo:
      # - "${UNSLOTH_JUPYTER_PORT:-8891}:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  gateway:
    profiles: ["services"]
    build:
      context: ./gateway
      dockerfile: Dockerfile
    env_file: .env
    environment:
      OCABRA_API_URL: http://api:8000
      GATEWAY_PORT: "9000"
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8484:80"
      - "${SERVICES_PORTAL_PORT:-8485}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/caddy_data:/data
      - ./caddy/caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  a1111_venv:
  docker_agent_token:
  backends_data:
